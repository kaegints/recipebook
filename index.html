<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kae's Recipe Book</title>
<style>
  :root {
    --ink: #1f2a24;
    --muted: #6f7d74;
    --paper: #fffdf6;
    --cream: #f6f0df;
    --sage: #7f9b83;
    --sage-dark: #476b50;
    --sage-light: #dfe9df;
    --gold: #d5a94c;
    --line: #a9b9aa;
    --white: #ffffff;
    --shadow: 0 18px 50px rgba(39, 59, 45, .12);
    --radius: 18px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(213,169,76,.12), transparent 30%),
      linear-gradient(180deg, #f7f4ea 0%, #eef3ed 100%);
    min-height: 100vh;
  }

  .app {
    width: min(1480px, calc(100% - 28px));
    margin: 18px auto 38px;
  }

  .hero {
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(71,107,80,.14);
    border-radius: 24px;
    box-shadow: var(--shadow);
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 20px;
    align-items: end;
  }

  .eyebrow {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .16em;
    color: var(--sage-dark);
    font-weight: 800;
    margin-bottom: 8px;
  }

  h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(34px, 4vw, 58px); line-height: 1; }
  .hero p { margin: 12px 0 0; max-width: 760px; color: var(--muted); line-height: 1.55; }

  .hero-tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  button, input { font: inherit; }

  .search {
    min-width: 230px;
    border: 1px solid rgba(71,107,80,.25);
    border-radius: 999px;
    padding: 11px 16px;
    background: var(--white);
    color: var(--ink);
    outline: none;
  }
  .search:focus { border-color: var(--sage-dark); box-shadow: 0 0 0 4px rgba(71,107,80,.12); }

  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    gap: 18px;
    margin-top: 18px;
  }

  .sidebar, .content {
    background: rgba(255,255,255,.9);
    border: 1px solid rgba(71,107,80,.14);
    border-radius: 22px;
    box-shadow: var(--shadow);
  }

  .sidebar { padding: 16px; align-self: start; position: sticky; top: 18px; }
  .side-title { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted); font-weight: 800; margin: 4px 6px 10px; }

  .category-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 8px; }
  .category-tab {
    white-space: nowrap;
    border: 1px solid var(--sage-light);
    background: #f7faf7;
    color: var(--sage-dark);
    border-radius: 999px;
    padding: 8px 12px;
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
  }
  .category-tab.active { background: var(--sage-dark); color: white; border-color: var(--sage-dark); }

  .recipe-list { display: grid; gap: 8px; max-height: calc(100vh - 230px); overflow-y: auto; padding-right: 2px; }
  .recipe-button {
    width: 100%;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    color: var(--ink);
  }
  .recipe-button:hover { background: #f7faf7; }
  .recipe-button.active { background: var(--sage-light); border-color: #c6d7c7; }
  .recipe-button strong { display: block; margin-bottom: 4px; }
  .recipe-button span { color: var(--muted); font-size: 12px; }

  .content { overflow: hidden; }
  .recipe-header {
    padding: 24px;
    background: linear-gradient(135deg, #fffdf7, #edf4ec);
    border-bottom: 1px solid rgba(71,107,80,.16);
  }
  .recipe-topline { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
  .recipe-kicker { color: var(--sage-dark); text-transform: uppercase; letter-spacing: .14em; font-size: 12px; font-weight: 800; }
  .recipe-title { font-family: Georgia, serif; font-size: clamp(34px, 5vw, 62px); margin: 5px 0 8px; line-height: 1.05; }
  .recipe-subtitle { color: var(--muted); max-width: 820px; line-height: 1.55; }

  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .action-btn {
    border: 1px solid rgba(71,107,80,.22);
    background: white;
    color: var(--sage-dark);
    border-radius: 999px;
    padding: 9px 13px;
    cursor: pointer;
    font-weight: 800;
    font-size: 13px;
  }
  .action-btn:hover { background: #f5f9f5; }

  .meta-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 20px; }
  .meta-card { background: rgba(255,255,255,.75); border: 1px solid rgba(71,107,80,.14); border-radius: 14px; padding: 12px 14px; }
  .meta-card span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .1em; font-weight: 800; }
  .meta-card strong { display: block; margin-top: 5px; font-size: 16px; }

  .recipe-body { padding: 22px; }
  .section-label { font-size: 12px; text-transform: uppercase; letter-spacing: .14em; color: var(--sage-dark); font-weight: 800; margin: 0 0 10px; }

  .servings-control { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .servings-control input { width: 78px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .servings-control small { color: var(--muted); }

  .flow-wrap { overflow-x: auto; border-radius: 16px; border: 2px solid var(--sage-dark); background: var(--paper); }
  .flow-grid {
    min-width: 980px;
    display: grid;
    grid-template-columns: 250px repeat(var(--steps), minmax(125px, 1fr));
  }

  .flow-title {
    grid-column: 1 / -1;
    padding: 14px 16px;
    font-weight: 900;
    font-size: 19px;
    border-bottom: 1px solid var(--sage);
    background: #fbf8ea;
  }
  .flow-prep {
    grid-column: 1 / -1;
    text-align: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--sage);
    font-weight: 800;
    background: #fff;
  }

  .ingredient-cell, .step-cell {
    border-right: 1px solid var(--sage);
    border-bottom: 1px solid var(--sage);
    min-height: 72px;
    padding: 10px 12px;
    background: rgba(255,255,255,.78);
  }
  .ingredient-cell { font-weight: 700; }
  .ingredient-cell small { display:block; color: var(--muted); font-weight: 500; margin-top: 3px; }
  .step-cell { display: flex; align-items: center; justify-content: center; text-align: center; color: #334238; line-height: 1.25; }
  .step-cell.active { background: #f0f6ef; font-weight: 800; }
  .step-cell.blank { background: #fffdf7; }
  .step-header { background: var(--sage-light); font-weight: 900; min-height: 54px; }

  .notes-grid { display: grid; grid-template-columns: 1.1fr .9fr; gap: 16px; margin-top: 18px; }
  .note-card { border: 1px solid rgba(71,107,80,.18); border-radius: 16px; padding: 16px; background: #fbfdfb; }
  .note-card h3 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 22px; }
  .note-card p, .note-card li { color: #526158; line-height: 1.5; }
  .note-card ul { margin: 8px 0 0 20px; padding: 0; }

  .empty { padding: 70px 24px; text-align: center; color: var(--muted); }

  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; }
    .hero-tools { justify-content: flex-start; }
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; }
    .recipe-list { max-height: none; grid-template-columns: repeat(2, minmax(0,1fr)); }
    .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .notes-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 620px) {
    .app { width: min(100% - 14px, 1480px); margin-top: 7px; }
    .hero, .sidebar, .content { border-radius: 16px; }
    .hero { padding: 18px; }
    .recipe-list { grid-template-columns: 1fr; }
    .recipe-topline { display: block; }
    .header-actions { justify-content: flex-start; margin-top: 14px; }
    .recipe-header, .recipe-body { padding: 17px; }
  }

  @media print {
    body { background: white; }
    .hero, .sidebar, .header-actions, .servings-control { display: none !important; }
    .app { width: 100%; margin: 0; }
    .layout { display: block; margin: 0; }
    .content { box-shadow: none; border: none; }
    .flow-wrap { overflow: visible; }
    .flow-grid { min-width: 0; }
  }
</style>
</head>

let activeCategory = 'All';
let activeRecipeId = recipes[0].id;
let searchTerm = '';

const categoryTabs = document.getElementById('categoryTabs');
const recipeList = document.getElementById('recipeList');
const content = document.getElementById('content');
const searchInput = document.getElementById('searchInput');

function categories() { return ['All', ...new Set(recipes.map(r => r.category))]; }

function filteredRecipes() {
  return recipes.filter(r => {
    const inCategory = activeCategory === 'All' || r.category === activeCategory;
    const haystack = [r.title, r.subtitle, r.category, ...r.ingredients.map(i => i[0])].join(' ').toLowerCase();
    return inCategory && haystack.includes(searchTerm.toLowerCase());
  });
}

function renderTabs() {
  categoryTabs.innerHTML = categories().map(c => `<button class="category-tab ${c===activeCategory?'active':''}" data-category="${c}">${c}</button>`).join('');
  categoryTabs.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    activeCategory = btn.dataset.category;
    const list = filteredRecipes();
    if (!list.some(r => r.id === activeRecipeId)) activeRecipeId = list[0]?.id || null;
    render();
  }));
}

function renderList() {
  const list = filteredRecipes();
  recipeList.innerHTML = list.length ? list.map(r => `
    <button class="recipe-button ${r.id===activeRecipeId?'active':''}" data-id="${r.id}">
      <strong>${r.title}</strong><span>${r.category} · ${r.total}</span>
    </button>`).join('') : '<div class="empty">No matching recipes.</div>';
  recipeList.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    activeRecipeId = btn.dataset.id;
    render();
  }));
}

function scaleAmount(text, factor) {
  if (factor === 1) return text;
  const replacements = {'¼':0.25,'½':0.5,'¾':0.75,'⅓':1/3,'⅔':2/3,'⅛':0.125};
  const match = text.match(/^(\d+)?\s*([¼½¾⅓⅔⅛])?/);
  if (!match || (!match[1] && !match[2])) return text;
  let amount = (match[1] ? Number(match[1]) : 0) + (match[2] ? replacements[match[2]] : 0);
  const scaled = Math.round(amount * factor * 100) / 100;
  return text.replace(match[0], scaled.toString());
}

function renderContent() {
  const recipe = recipes.find(r => r.id === activeRecipeId);
  if (!recipe) { content.innerHTML = '<div class="empty">Choose a recipe.</div>'; return; }
  const steps = recipe.steps.length;
  const prepRows = recipe.prepNotes.map(n => `<div class="flow-prep">${n}</div>`).join('');
  const headers = `<div class="ingredient-cell step-header">Ingredients</div>` + recipe.steps.map(s => `<div class="step-cell step-header">${s}</div>`).join('');
  const rows = recipe.ingredients.map((ing, index) => {
    const cells = ing[2].map(text => `<div class="step-cell ${text?'active':'blank'}">${text || ''}</div>`).join('');
    return `<div class="ingredient-cell" data-base="${ing[1]}">${ing[0]}<small class="amount">${ing[1]}</small></div>${cells}`;
  }).join('');
  const processRow = `<div class="ingredient-cell"><strong>Overall process</strong></div>` + recipe.process.map(t => `<div class="step-cell ${t?'active':'blank'}">${t || ''}</div>`).join('');

  content.innerHTML = `
    <section class="recipe-header">
      <div class="recipe-topline">
        <div>
          <div class="recipe-kicker">${recipe.category}</div>
          <h2 class="recipe-title">${recipe.title}</h2>
          <div class="recipe-subtitle">${recipe.subtitle}</div>
        </div>
        <div class="header-actions">
          <button class="action-btn" id="printBtn">Print recipe</button>
          <button class="action-btn" id="resetBtn">Reset servings</button>
        </div>
      </div>
      <div class="meta-grid">
        <div class="meta-card"><span>Servings</span><strong id="servingsMeta">${recipe.servings}</strong></div>
        <div class="meta-card"><span>Prep</span><strong>${recipe.prep}</strong></div>
        <div class="meta-card"><span>Cook</span><strong>${recipe.cook}</strong></div>
        <div class="meta-card"><span>Difficulty</span><strong>${recipe.difficulty}</strong></div>
      </div>
    </section>
    <section class="recipe-body">
      <div class="section-label">Visual cooking flow</div>
      <div class="servings-control">
        <label for="servingsInput"><strong>Scale servings:</strong></label>
        <input id="servingsInput" type="number" min="1" max="24" value="${recipe.servings}" />
        <small>Ingredient amounts are scaled automatically where possible.</small>
      </div>
      <div class="flow-wrap">
        <div class="flow-grid" style="--steps:${steps}">
          <div class="flow-title">${recipe.title} <span style="font-weight:500">(about ${recipe.servings} servings)</span></div>
          ${prepRows}
          ${headers}
          ${rows}
          ${processRow}
        </div>
      </div>
      <div class="notes-grid">
        <div class="note-card"><h3>Useful notes</h3><ul>${recipe.tips.map(t => `<li>${t}</li>`).join('')}</ul></div>
        <div class="note-card"><h3>Storage</h3><p>${recipe.storage}</p><p><strong>Total time:</strong> ${recipe.total}</p></div>
      </div>
    </section>`;

  document.getElementById('printBtn').onclick = () => window.print();
  document.getElementById('resetBtn').onclick = () => { document.getElementById('servingsInput').value = recipe.servings; updateScale(recipe); };
  document.getElementById('servingsInput').addEventListener('input', () => updateScale(recipe));
}

function updateScale(recipe) {
  const input = document.getElementById('servingsInput');
  const servings = Math.max(1, Number(input.value) || recipe.servings);
  const factor = servings / recipe.servings;
  document.getElementById('servingsMeta').textContent = servings;
  document.querySelectorAll('.ingredient-cell[data-base]').forEach(cell => {
    const base = cell.dataset.base;
    cell.querySelector('.amount').textContent = scaleAmount(base, factor);
  });
}

function render() { renderTabs(); renderList(); renderContent(); }
searchInput.addEventListener('input', e => { searchTerm = e.target.value; const list = filteredRecipes(); activeRecipeId = list[0]?.id || null; render(); });
render();
</script>
</body>
</html>
